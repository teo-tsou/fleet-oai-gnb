{{- if .Values.multus.enabled }}
{{- range .Values.multus.interfaces }}
{{- if .enabled }}
{{- if eq .type "ipvlan" }}
# IntEdge: ipvlan (L2) shares the node VM's MAC address, which the VM's own network accepts; a macvlan interface
# brings a new MAC the platform's network drops. No hostInterface = the VM's default-route interface: a node VM that
# holds a passed-through device has its NIC on another PCI slot (enp3s0 instead of enp1s0, 2026-10-26).
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app: {{ $.Release.Name }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "{{ $.Release.Name }}-{{ .name }}",
    "type": "ipvlan",
    {{- if .hostInterface }}
    "master": "{{ .hostInterface }}",
    {{- end }}
    "mode": "{{ default "l2" .mode }}",
    "ipam": {
      "type": "static",
      "addresses": [
        { "address": "{{ .ipAdd }}/{{ .netmask }}" }
      ]
      {{- if .routes }},
      "routes": {{ toJson .routes }}
      {{- end }}
    }
  }'
---
{{- end }}
{{- if eq .type "macvlan" }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app: {{ $.Release.Name }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "{{ $.Release.Name }}-{{ .name }}",
    "plugins": [
      {
        "type": "macvlan",
        "master": "{{ .hostInterface }}",
        "mode": "{{ default "bridge" .mode }}",
        "ipam": {
          {{- if eq .ipAdd "dhcp" }}
          "type": "dhcp"
          {{- else }}
          "type": "static",
          "addresses": [
            { "address": "{{ .ipAdd }}/{{ .netmask }}" }
          ]
          {{- end }}
          {{- if .routes }},
          "routes": {{ toJson .routes }}
          {{- end }}
          {{- if .gateway }},
          "gateway": "{{ .gateway }}"
          {{- end }}
        }
      }
      ]
  }'
---
{{- end }}

{{- if eq .type "vlan" }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app: {{ $.Release.Name }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "vlan",
    "master": "{{ .hostInterface }}",
    "vlanId": {{ .vlan }},
    "ipam": {
      "type": "static",
      "addresses": [
        { "address": "{{ .ipAdd }}/{{ .netmask }}" }
      ]
      {{- if .routes }},
      "routes": {{ toJson .routes }}
      {{- end }}
      {{- if .gateway }},
      "gateway": "{{ .gateway }}"
      {{- end }}
    }
  }'
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
