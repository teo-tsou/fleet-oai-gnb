# IntEdge defaults: the OAI gNB driving a USRP B210 (USB), in a user cluster whose worker pool "radio" holds the radio
# (passed through to that pool's node VM). The 5G core is free5GC (fleet-free5gc-control), reached through the IntEdge
# `amf` binding, like fleet-ueransim.

nfimage:
  # OAI 2026.w43 with the B2xx firmware baked in (image/Dockerfile), built by this repo's workflow and published on
  # GHCR. Air-gapped sites: the hub mirrors ghcr.io like docker.io, so the same name is served by the hub registry.
  repository: ghcr.io/teo-tsou/oai-gnb-b210
  version: "2026.w43"
  digest: "sha256:9fce9742b1c78bc58d38247f34f0d6e1d4d8bd67845030a46d35b4cf5987dd31"   # image workflow run 40167379406

radio:
  firmware: baked                   # the image carries the USRP firmware: no download at start
  usbAccess: privileged             # the B210 reconnects when its firmware loads (see charts/values.yaml)

config:
  gnbName: intedge-gnb
  radio: b2xx
  useAdditionalOptions: "-E --continuous-tx --log_config.global_log_options level,nocolor,time"
  amfHost: amf.upstream.svc.cluster.local   # the IntEdge `amf` binding to the core's AMF
  tac: 1
  plmn_list:                         # free5GC's defaults (as fleet-ueransim)
    - mcc: "208"
      mnc: "93"
      mnc_length: 2
      snssaiList:
        - sst: 1
          sd: "0x010203"

# N3 (GTP-U to the UPF): the UPF (fleet-free5gc-upf) runs in THIS cluster with its N3 on an ipvlan of the node VM's
# NIC, 10.100.50.233 in 10.100.50.232/29, and the core's SMF hands that address to the gNB at each session. The gNB
# needs its own address on that /29 (the pod network cannot reach an ipvlan address on its own node, and the UPF sends
# downlink to the gNB's N3 address). .233 = UPF, .234 = UERANSIM's gNB, .238 = excluded gateway: .235 here.
# N2 stays on the pod network (the `amf` binding). Needs Multus in the cluster (the app's prerequisite multus-cni).
multus:
  enabled: true
  n2OnPodNetwork: true
  interfaces:
    - name: n3
      enabled: true
      type: ipvlan
      mode: l2
      # no hostInterface: the VM's default-route interface. Its name depends on the VM's other PCI devices: the radio
      # VM, which holds a whole USB controller, names its NIC enp3s0 (2026-10-26), a plain one enp1s0.
      ipAdd: 10.100.50.235
      netmask: "29"

# the pool that holds the radio
nodeSelector:
  intedge.io/pool: radio

# whole CPUs, requests = limits: a Guaranteed pod, so a node with the static CPU manager gives it cores of its own
resources:
  define: true
  requests:
    nf:
      cpu: "3"
      memory: 3Gi
    tcpdump:
      cpu: 100m
      memory: 128Mi
  limits:
    nf:
      cpu: "3"
      memory: 3Gi
    tcpdump:
      cpu: 100m
      memory: 128Mi
