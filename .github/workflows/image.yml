# Builds image/Dockerfile (OAI gNB + the USRP B2xx firmware) and publishes it to GHCR. Actions are pinned by commit:
# a moved tag cannot change what builds the image. The image carries an SBOM and build provenance.
name: image
on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683            # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1         # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83    # v6.18.0
        with:
          context: image
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/teo-tsou/oai-gnb-b210:2026.w43
            ghcr.io/teo-tsou/oai-gnb-b210:sha-${{ github.sha }}
      - name: digest
        run: echo "pushed ghcr.io/teo-tsou/oai-gnb-b210@${{ steps.build.outputs.digest }} (set nfimage.digest to it)"
